<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LWH Fleet View</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fleet View">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Sign-in ===== -->
  <section id="login" class="login" hidden>
    <form id="loginForm" class="login-card" autocomplete="off">
      <div class="brand-mark lg" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>Fleet View</h1>
      <p class="muted">Live trucks and trailers for Logistics Warehouse managers.</p>
      <label for="loginName">Your name</label>
      <input id="loginName" type="text" maxlength="40" required autocomplete="name">
      <label for="loginPin">Team PIN</label>
      <input id="loginPin" type="password" inputmode="numeric" maxlength="12" required>
      <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="app" hidden>
    <div id="map" aria-label="Map of trucks and trailers"></div>

    <!-- Floating search -->
    <div class="searchbar" role="search">
      <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <input id="search" type="search" placeholder="Search trucks, trailers, drivers" aria-label="Search trucks, trailers, drivers"
             autocomplete="off" role="combobox" aria-controls="suggest" aria-expanded="false" enterkeyhint="search">
      <button id="clearBtn" class="icon-btn" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
      <button id="listBtn" class="icon-btn list-btn" type="button" aria-label="Show list" aria-pressed="false" title="List">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h3v3H3zm5 0h13v3H8zm-5 5.5h3v3H3zm5 0h13v3H8zM3 16h3v3H3zm5 0h13v3H8z"/></svg>
      </button>
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div id="suggest" class="suggest" role="listbox" aria-label="Matches" hidden></div>
      <div id="menu" class="menu" hidden>
        <div class="menu-who" id="menuWho"></div>
        <button type="button" data-menu="yard">Yard checks</button>
        <button type="button" data-menu="refresh">Refresh now</button>
        <button type="button" data-menu="signout">Sign out</button>
      </div>
    </div>

    <!-- Show trucks, trailers or both (one tap, always on the map) -->
    <div class="show-seg" role="group" aria-label="Show on map">
      <button type="button" data-show="both">Both</button>
      <button type="button" data-show="trucks">Trucks</button>
      <button type="button" data-show="trailers">Trailers</button>
    </div>

    <!-- PC, list closed: one-line summary; tap to open the list -->
    <button id="sumPill" class="sum-pill" type="button" aria-label="Open the list" hidden></button>

    <!-- Map buttons -->
    <div class="map-btns">
      <button class="map-btn" id="layerBtn" type="button" aria-label="Switch to satellite" title="Satellite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 8.5 12 14l10-5.5L12 3Z"/><path d="m2 13.5 10 5.5 10-5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
      <button class="map-btn" id="siteBtn" type="button" aria-label="Center on my site" title="My site">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg>
      </button>
      <button class="map-btn" id="ycBtn" type="button" aria-label="Yard checks" title="Yard checks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3zm0 2v1h6V5zm-1 6v2h8v-2zm0 4v2h5v-2z"/></svg>
      </button>
      <button class="map-btn" id="fitBtn" type="button" aria-label="Show everything" title="Show everything">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>

    <!-- List panel: side panel on PC, pull-up sheet on phone -->
    <section id="sheet" class="sheet" data-state="peek" aria-label="Trucks and trailers">
      <div class="sheet-head" id="sheetHead">
        <div class="grabber" aria-hidden="true"></div>
        <div class="peek-summary" id="peekSummary"></div>
        <div class="site-row">
          <label for="sitePick" class="site-label">I'm at</label>
          <select id="sitePick"></select>
          <span id="updated" class="updated">Loading</span>
          <button id="filterBtn" class="filter-btn" type="button" aria-expanded="false" aria-controls="chips">Filters</button>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Show" hidden>
          <button class="chip" data-filter="longest" type="button">Sitting longest</button>
          <button class="chip" data-filter="defects" type="button" hidden>Open defects</button>
          <button class="chip" data-filter="lowfuel" type="button" hidden>Low fuel</button>
          <button class="chip" data-filter="empty" type="button">Empty only</button>
          <button class="chip" data-filter="dead" type="button" hidden>Inactive</button>
          <button class="chip on" data-filter="nogps" type="button" hidden>No-GPS trailers</button>
        </div>
      </div>
      <div id="list" class="list"></div>
      <div id="focusCard" class="focus-card" hidden></div>
    </section>

    <!-- Yard checks: same data as the Driver Toolkit Dispatch Board -->
    <section id="ycPanel" class="yc-panel" hidden aria-label="Yard checks">
      <div class="yc-head">
        <button class="icon-btn" id="ycClose" type="button" aria-label="Close yard checks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
        </button>
        <h2>Yard checks</h2>
        <span id="ycUpdated" class="updated"></span>
      </div>
      <div class="yc-tabs" role="tablist">
        <button type="button" role="tab" data-yctab="yards">Yards</button>
        <button type="button" role="tab" data-yctab="find">Find a trailer</button>
        <button type="button" role="tab" data-yctab="new">New check</button>
      </div>
      <div id="ycBody" class="yc-body"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="yard.js"></script>
  <script src="app.js"></script>
<!-- LWH-USAGE-START: anonymous app-usage ping (see hub.logisticswarehouse.net/usage/) -->
<script>
(function () {
  var APP = 'Fleet View';
  var URL_ = 'https://tjivcqxnkftujceumdtx.supabase.co/rest/v1/rpc/log_app_usage';
  var KEY = 'sb_publishable_PYlWSW6-Gi-QZl91IXUq0Q_W5mO3sDT';
  var ls = {}; try { ls = window.localStorage || {}; } catch (e) {}
  function get(k) { try { return ls.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { ls.setItem(k, v); } catch (e) {} }
  var dev = get('lwhUsageDev');
  if (!dev) { dev = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); set('lwhUsageDev', dev); }
  var standalone = !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone);
  function queue() { try { return JSON.parse(get('lwhUsageQ') || '[]'); } catch (e) { return []; } }
  function send(row) {
    return fetch(URL_, { method: 'POST', keepalive: true, headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(row) })
      .then(function (r) { if (!r.ok) throw 0; });
  }
  function flush() {
    var q = queue(); if (!q.length || !navigator.onLine) return;
    set('lwhUsageQ', '[]');
    q.forEach(function (row) { send(row).catch(function () { var r = queue(); r.push(row); set('lwhUsageQ', JSON.stringify(r.slice(-50))); }); });
  }
  function track(event) {
    var row = { p_app: APP, p_event: event || 'open', p_device: dev, p_path: location.pathname, p_standalone: standalone, p_at: new Date().toISOString() };
    send(row).then(flush).catch(function () { var q = queue(); q.push(row); set('lwhUsageQ', JSON.stringify(q.slice(-50))); });
  }
  window.lwhTrack = track; // optional: lwhTrack('bol_created') to count a feature
  var last = Date.now(); track('open');
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - last > 30 * 60 * 1000) { last = Date.now(); track('open'); }
  });
  window.addEventListener('online', flush);
})();
</script>
<!-- LWH-USAGE-END -->
</body>
</html>
